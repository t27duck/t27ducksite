<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Tab-size version of icon.svg: drawn on a 32px grid, delta enlarged to fill
       the square, and the silver keylines dropped (they're sub-pixel at 16px). -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#0C2A5C"/>
    </linearGradient>
    <linearGradient id="deltaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3E8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="url(#bgGrad)"/>
  <polygon points="16,2 30,30 2,30" fill="url(#deltaGrad)"/>
  <polygon points="16,11 22.5,26 9.5,26" fill="#0A1F44"/>
</svg>
